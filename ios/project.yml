# Insieme for iPad (and iPhone). XcodeGen turns this into Insieme.xcodeproj on the cloud Mac (.github/workflows/ios.yml); nobody
# edits the Xcode project by hand. Set up like train-widget/ios/project.yml (the ios-testflight skill).
name: Insieme
options:
  bundleIdPrefix: org.jordancox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Runs the Kokoro voice model on the iPad (Apache 2.0; Jordan's OK, 17 Oct 2026). Kokoro.swift.
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Insieme:
    type: application
    platform: iOS
    scheme: {}
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
    sources:
      - path: App/Sources
      - path: App/Data # cards.json, from tools/cards.py
        type: folder
        buildPhase: resources
      - path: App/Sprites # from PokeAPI, by tools/cards.py
        type: folder
        buildPhase: resources
      - path: App/Sounds # from tools/sounds.py
        type: folder
        buildPhase: resources
      - path: build/Cards # the card pictures: tools/cards.py art downloads them on the cloud Mac, never committed
        type: folder
        buildPhase: resources
      - path: build/Kokoro # the voice model: ci/kokoro.sh downloads it on the cloud Mac, never committed
        type: folder
        buildPhase: resources
      - path: build/Voice # sentences made ahead on the cloud Mac before a TestFlight build (ci/voice.sh); empty otherwise
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Insieme
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # It lies flat between two players, so it never turns: upright for the player at the bottom.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Per leggere il codice sulle carte. / To read the code on his cards."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jordancox.insieme
        PRODUCT_NAME: Insieme
        # iPad and iPhone (Jordan, 18 Oct 2026: "we should do an iPhone build too"); the phone gets the same board, scaled
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
